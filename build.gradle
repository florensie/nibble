plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"nibble" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation "org.assertj:assertj-core:${project.assertj_version}"
	testImplementation "org.junit.jupiter:junit-jupiter-params"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	// Dev runtime
//	runtimeOnly "curse.maven:appleskin-248787:${project.appleskin_version}"
//	runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
//	runtimeOnly "com.terraformersmc:modmenu:${project.mod_menu_version}"
//	runtimeOnly "curse.maven:lazydfu-433518:${project.lazydfu_version}"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}
